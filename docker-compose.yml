services:
  mysql:
    image: mysql:8.0
    container_name: cashline-mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: cashline
      MYSQL_USER: cashline
      MYSQL_PASSWORD: cashline123
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build:
      context: ./backend
    container_name: cashline-web
    depends_on:
      - mysql
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: dev-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: cashline
      MYSQL_USER: cashline
      MYSQL_PASSWORD: cashline123
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin123
    ports:
      - "8000:8000"

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: cashline-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root123
      UPLOAD_LIMIT: 128M
    ports:
      - "8080:80"

volumes:
  mysql_data:
